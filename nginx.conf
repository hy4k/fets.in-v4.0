server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build output and media never change under the same name.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hand-maintained files keep their names between releases (support desk,
    # enhancements, the knowledge base) — always revalidate so edits go live.
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
